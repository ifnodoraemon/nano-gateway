version: '3.8'

services:
  # ============================================================================
  # High-Availability Gateway Node 1
  # ============================================================================
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: nano-gateway:latest
    container_name: nano-gateway-1
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # High-Availability Gateway Node 2
  # ============================================================================
  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: nano-gateway:latest
    container_name: nano-gateway-2
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # High-Availability Load Balancer (Nginx with SSE stream support)
  # ============================================================================
  lb:
    image: nginx:alpine
    container_name: nano-gateway-lb
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-1
      - gateway-2

volumes:
  gateway-data:
    driver: local
